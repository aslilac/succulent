name: Check

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6
        name: Checkout

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v6
        name: Install dependencies
        with:
          run_install: true
          cache: true

      - run: pnpm test
        name: Run tests

      - run: pnpm test
        name: Run e2e tests
        working-directory: tests/

  check:
    name: Check

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        name: Checkout

      - uses: crate-ci/typos@v1
        name: Spellcheck

      - uses: pnpm/action-setup@v6
        name: Install dependencies
        with:
          run_install: true
          cache: true

      - run: pnpm -- prettier --check .
        name: Format

      - run: pnpm type-check
        name: Check types
